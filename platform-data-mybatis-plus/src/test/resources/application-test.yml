spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  liquibase:
    change-log: classpath:/db/changelogs/changelog-master.xml
    enabled: true
  sql:
    init:
      mode: never

mybatis-plus:
  type-handlers-package: com.old.silence.data.commons.handler
  global-config:
    db-config:
      table-underline: true
